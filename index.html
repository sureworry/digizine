<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>shar's zine shelf</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrapper">
  <header class="header">
    <h1 class="title">shar's zine shelf</h1>
    <img src="assets/decorations/flower.png" alt="" class="header-flower" aria-hidden="true">
    <div class="datetime-wrap">
      <p class="datetime-date" id="datetime-date"></p>
      <p class="datetime-time" id="datetime-time"></p>
    </div>
  </header>

  <main class="shelf-container">
    <div class="content-frame" id="content-frame" aria-label="Homepage scene">
      <img
        src="assets/decorations/shelf.png"
        alt=""
        class="layout-item layout-shelf"
        data-layout-id="shelf"
        draggable="false"
        aria-hidden="true"
      >
      <img
        src="assets/decorations/shelf.png"
        alt=""
        class="layout-item layout-shelf"
        data-layout-id="shelf-2"
        draggable="false"
        aria-hidden="true"
      >

      <img
        src="assets/cover/self-perception.png"
        alt="self-perception"
        class="layout-item zine-cover"
        data-layout-id="self-perception"
        data-zine="self-perception"
        draggable="false"
      >
      <img
        src="assets/cover/observations as a introvert.png"
        alt="observations as a introvert"
        class="layout-item zine-cover"
        data-layout-id="observations"
        data-zine="observations as a introvert"
        draggable="false"
      >
      <img
        src="assets/cover/collection of stillherestilllife.png"
        alt="collection of stillherestilllife"
        class="layout-item zine-cover"
        data-layout-id="collection"
        data-zine="collection of stillherestilllife"
        draggable="false"
      >

      <img
        src="assets/cover/the idea marinade.png"
        alt="the idea marinade"
        class="layout-item zine-cover layout-draggable"
        data-layout-id="idea-marinade"
        data-zine="the idea marinade"
        data-draggable="true"
        draggable="false"
      >
      <img
        src="assets/cover/romanticise the mundane.png"
        alt="romanticise the mundane"
        class="layout-item zine-cover layout-draggable"
        data-layout-id="romanticise"
        data-zine="romanticise the mundane"
        data-draggable="true"
        draggable="false"
      >

      <img
        src="assets/cover/about.png"
        alt="About the creator"
        class="layout-item about-card layout-draggable"
        data-layout-id="about"
        data-draggable="true"
        draggable="false"
      >
      <img
        src="assets/cover/confessions of an anxious creator.png"
        alt="confessions of an anxious creator"
        class="layout-item zine-cover zine-cover--confessions"
        data-layout-id="confessions"
        data-zine="confessions of an anxious creator"
        draggable="false"
      >

      <img
        src="assets/decorations/plant.png"
        alt=""
        class="layout-item layout-draggable decoration decoration-plant"
        data-layout-id="plant"
        data-draggable="true"
        draggable="false"
        aria-hidden="true"
      >
      <img
        src="assets/decorations/snake-plant.png"
        alt=""
        class="layout-item layout-draggable decoration decoration-snake-plant"
        data-layout-id="snake-plant"
        data-draggable="true"
        draggable="false"
        aria-hidden="true"
      >
      <img
        src="assets/decorations/chinese cat.png"
        alt=""
        class="layout-item layout-draggable decoration decoration-chinese-cat"
        data-layout-id="chinese-cat"
        data-draggable="true"
        draggable="false"
        aria-hidden="true"
      >
      <img
        src="assets/decorations/lamp.png"
        alt=""
        class="layout-item layout-draggable decoration decoration-lamp"
        data-layout-id="lamp"
        data-draggable="true"
        draggable="false"
        aria-hidden="true"
      >
      <img
        src="assets/decorations/books.png"
        alt=""
        class="layout-item layout-draggable decoration decoration-books"
        data-layout-id="books"
        data-draggable="true"
        draggable="false"
        aria-hidden="true"
      >
      <img
        src="assets/decorations/coffee.png"
        alt=""
        class="layout-item layout-draggable decoration decoration-coffee"
        data-layout-id="coffee"
        data-draggable="true"
        draggable="false"
        aria-hidden="true"
      >
      <div
        class="layout-item layout-draggable decoration decoration-cat"
        data-layout-id="cat"
        data-draggable="true"
        draggable="false"
        role="img"
        aria-label="Cat decoration"
      >
        <img src="assets/decorations/pokerface.png" alt="" class="decoration-cat__img decoration-cat__img--default" aria-hidden="true">
        <img src="assets/decorations/smiling.png" alt="" class="decoration-cat__img decoration-cat__img--smiling" aria-hidden="true">
      </div>
    </div>
    <!-- In-flow width so .shelf-container overflow-x includes the full artboard (abs.pos. children alone do not always extend scroll width). -->
    <div class="content-frame-scroll-track" aria-hidden="true"></div>
  </main>
  </div>

  <script src="homepage-spec.js"></script>
  <script src="script.js"></script>
</body>
</html>
