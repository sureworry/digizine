<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-2CLZXDDGVZ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-2CLZXDDGVZ');

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Issue — shar's zine shelf</title>
  <link rel="preload" href="assets/fonts/makibafont13.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="issue-page issue-page--scroll">
  <div class="wrapper issue-wrapper">
    <header class="header">
      <h1 class="title">
        <a href="index.html" id="header-title">
          <span class="title-stack">
            <span class="title-line">shar's</span>
            <span class="title-line">zine shelf</span>
          </span>
        </a>
      </h1>
      <img src="assets/decorations/flower.png" alt="" class="header-flower" aria-hidden="true">
      <div class="datetime-wrap">
        <p class="datetime-date" id="datetime-date"></p>
        <p class="datetime-time" id="datetime-time"></p>
      </div>
    </header>

    <main class="issue-scroll-main">
      <div class="issue-zine-frame issue-zine-frame--scroll zine-inner">
        <div class="zine-strip-wrap">
          <div id="zine-strip-root" class="zine-strip-root"></div>
          <script>
            /* Hold the homepage-zoomed cover on screen from the first paint until the reader has drawn its own. */
            (function () {
              try {
                var d = JSON.parse(sessionStorage.getItem('digizineCoverZoom') || 'null');
                if (!d || !d.rect || !d.src || Date.now() - d.at > 5000) return;
                var img = document.createElement('img');
                img.className = 'cover-zoom-hold';
                img.alt = '';
                img.decoding = 'sync';
                img.src = d.src;
                img.style.left = d.rect.left + 'px';
                img.style.top = d.rect.top + 'px';
                img.style.width = d.rect.width + 'px';
                img.style.height = d.rect.height + 'px';
                document.body.appendChild(img);
              } catch (e) {}
            })();
          </script>
        </div>
      </div>
      <a href="index.html" class="issue-back">back to shelf</a>
    </main>
  </div>

  <script src="script.js"></script>
  <script src="issue-data.js"></script>
  <script src="zine-strip.js"></script>
  <script src="zine-accordion.js"></script>
  <script src="issue-strip-interaction.js"></script>
  <script src="issue.js"></script>
  <script type="module" src="vercel-analytics.js"></script>
</body>
</html>
